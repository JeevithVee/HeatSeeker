# HeatSeeker standard tables.
#
# STATUS: FROZEN 2026-11-14. All four agents agreed on the MessageBoard.
# Changes now need agreement of all four.
#
# Conventions that apply to every table:
#   - country_code (ISO 3166-1 alpha-2) and city_id are on every table.
#   - site_id is an H3 cell index at `h3_resolution`, as a 15-character
#     lowercase hex string. The same string is used in every table.
#   - Metric units. Temperatures in Kelvin. Shares are fractions 0-1, not percent.
#   - Timestamps are UTC. Dates are ISO 8601.
#   - Unity Catalog names are <catalog>.<layer>.<table>; the catalog name is
#     set per workspace (see `catalog` below), the layer and table are fixed.

version: 1.0.0
status: frozen
catalog: heatseeker        # created in the workspace by Agent 3
h3_resolution: 9           # ~0.105 km2 per cell, edge ~174 m
country_codes: [US]
city_ids:
  nyc: New York
  dc: Washington DC
  sf: San Francisco
  sea: Seattle

# City grid rule: a cell belongs to a city when its centroid is inside the
# city boundary polygon (land boundary, clipped to the shoreline).

tables:

  bronze:
    # One physical table per source, named bronze.<source_id>. All share these
    # columns. Raw data as received; nothing is dropped or corrected here.
    writer: [agent-1, agent-2]
    grain: one row per source record
    columns:
      country_code:  {type: string, nullable: false}
      city_id:       {type: string, nullable: false}
      role:          {type: string, nullable: false, description: "Country-neutral data role, see roles.yaml"}
      value:         {type: double, nullable: true,  description: "Numeric value of the record in `units`"}
      units:         {type: string, nullable: true}
      date:          {type: string, nullable: true,  description: "Date or timestamp exactly as received from the source"}
      geometry:      {type: string, nullable: true,  description: "WKT, EPSG:4326"}
      source:        {type: string, nullable: false, description: "Source id, e.g. nyc_forestry_tree_points"}
      license:       {type: string, nullable: false}
      source_record_id: {type: string, nullable: true, description: "Record id in the source system"}
      attributes:    {type: string, nullable: true,  description: "JSON object with the remaining source fields, unmodified"}
      ingested_at:   {type: timestamp, nullable: false}

  silver.interventions:
    writer: agent-1
    readers: [agent-3, agent-4]
    grain: one row per site_id x plant_year x intervention_type
    notes: >
      Only cells with at least one dated planting appear. All years from 2015
      on are included, not only the 2015-2019 evaluation window, so that
      evaluation can exclude later-planted cells from the control pool.
    columns:
      country_code:       {type: string, nullable: false}
      city_id:            {type: string, nullable: false}
      site_id:            {type: string, nullable: false}
      plant_year:         {type: int,    nullable: false, description: "Calendar year of the planting date"}
      intervention_type:  {type: string, nullable: false, description: "tree_planting for now"}
      trees_planted:      {type: int,    nullable: false, description: "Trees with a valid planting date in this cell and year"}
      trees_removed:      {type: int,    nullable: false, description: "Of trees_planted, how many the source now records as removed or dead (stump, retired)"}
      trees_surviving:    {type: int,    nullable: false, description: "trees_planted - trees_removed"}
      removed_flag:       {type: boolean, nullable: false, description: "True only when trees_surviving = 0"}
      removal_tracked:    {type: boolean, nullable: false, description: "False when the source lists only standing trees, so trees_removed is a lower bound of 0"}
      trees_batch_dated:  {type: int,    nullable: false, description: "Of trees_planted, how many carry a date flagged as a likely batch entry. Flagged, not dropped"}
      first_plant_date:   {type: date,   nullable: false}
      last_plant_date:    {type: date,   nullable: false}
      source:             {type: string, nullable: false}

  silver.features:
    writer: agent-1
    readers: [agent-3, agent-4]
    grain: one row per site_id, for every cell in the city grid
    columns:
      country_code:         {type: string, nullable: false}
      city_id:              {type: string, nullable: false}
      site_id:              {type: string, nullable: false}
      centroid_lat:         {type: double, nullable: false}
      centroid_lon:         {type: double, nullable: false}
      area_km2:             {type: double, nullable: false}
      canopy_frac_baseline: {type: double, nullable: true, description: "Tree canopy fraction in canopy_year_baseline"}
      canopy_year_baseline: {type: int,    nullable: true}
      canopy_frac_latest:   {type: double, nullable: true}
      canopy_year_latest:   {type: int,    nullable: true}
      impervious_frac:      {type: double, nullable: true}
      land_cover_class:     {type: string, nullable: true, description: "Dominant land cover class in the cell"}
      land_cover_year:      {type: int,    nullable: true}
      elevation_m:          {type: double, nullable: true}
      population:           {type: double, nullable: true, description: "Residents allocated to the cell"}
      share_age_65_plus:    {type: double, nullable: true, description: "Raw vulnerability input: share of residents aged 65 or older, 0-1"}
      share_low_income:     {type: double, nullable: true, description: "Raw vulnerability input: share of residents on low income (US: below 150% of the poverty line), 0-1"}
      vulnerable_residents: {type: double, nullable: true, description: "population x vulnerability_index"}
      vulnerability_index:  {type: double, nullable: true, description: "0-1, higher is more vulnerable. Formula comes from country config"}
      median_household_income: {type: double, nullable: true, description: "Local currency units per year"}
      existing_tree_count:  {type: int,    nullable: true, description: "Standing trees in the city inventory, dated or not"}

  silver.panel:
    # Agent 2 owns this definition (MessageBoard, Agent 2 msg 1).
    writer: agent-2
    readers: [agent-3, agent-4]
    grain: one row per site_id x scene_id, for every cell in the city grid
    notes: >
      No averaging across scenes. Rows with zero clear pixels are dropped, so
      a cell missing from a scene means "no clear view". A city can sit in two
      Landsat paths, so a cell can appear twice within a week on different
      scene_ids, and edge scenes cover only part of the city.
    columns:
      country_code:           {type: string, nullable: false}
      city_id:                {type: string, nullable: false}
      site_id:                {type: string, nullable: false}
      scene_id:               {type: string, nullable: false, description: "Landsat product id"}
      acquired_at_utc:        {type: timestamp, nullable: false}
      acquired_date:          {type: date,   nullable: false}
      year:                   {type: int,    nullable: false}
      sensor:                 {type: string, nullable: false, description: "LANDSAT_8 | LANDSAT_9"}
      lst_mean_k:             {type: double, nullable: true}
      lst_median_k:           {type: double, nullable: true}
      lst_std_k:              {type: double, nullable: true}
      valid_pixel_count:      {type: int,    nullable: false}
      valid_pixel_frac:       {type: double, nullable: false, description: "Clear pixels / all pixels in the cell, 0-1"}
      is_clear:               {type: boolean, nullable: false, description: "valid_pixel_frac >= 0.8"}
      scene_cloud_cover_frac: {type: double, nullable: true, description: "Whole Landsat scene, 0-1"}
      city_clear_frac:        {type: double, nullable: true, description: "Share of city cells with is_clear in this scene, 0-1"}
      sun_elevation_deg:      {type: double, nullable: true}
      wrs_path:               {type: int,    nullable: true}
      wrs_row:                {type: int,    nullable: true}
      tmax_c:                 {type: double, nullable: true, description: "City mean for the scene date"}
      tmin_c:                 {type: double, nullable: true}
      wind_speed_ms:          {type: double, nullable: true}
      precip_mm:              {type: double, nullable: true}
      source:                 {type: string, nullable: false}
      license:                {type: string, nullable: false}

  gold.site_effects:
    # Agent 3 owns this definition (MessageBoard, Agent 3 msg 1).
    writer: agent-3
    readers: [agent-4]
    grain: one row per site_id x variant
    notes: >
      The 'all' variant is the headline; 'excl_batch_dated' is the robustness
      check. Effects are Kelvin differences in surface temperature, not felt
      temperature.
    columns:
      country_code:      {type: string, nullable: false}
      city_id:           {type: string, nullable: false}
      site_id:           {type: string, nullable: false}
      variant:           {type: string, nullable: false, description: "all | excl_batch_dated"}
      treatment_year:    {type: int,    nullable: false, description: "First year the cumulative trees_planted (from 2015) reaches min_dose"}
      intervention_type: {type: string, nullable: false}
      dose_trees:        {type: int,    nullable: false, description: "trees_planted summed over the treatment window 2015-2019. Only cells reaching min_dose inside the window get a row"}
      n_pre_scenes:      {type: int,    nullable: false}
      n_post_scenes:     {type: int,    nullable: false}
      n_controls:        {type: int,    nullable: false}
      effect_k:          {type: double, nullable: true, description: "Difference-in-differences estimate. Negative = cooling"}
      effect_se_k:       {type: double, nullable: true}
      ci_low_k:          {type: double, nullable: true}
      ci_high_k:         {type: double, nullable: true}
      placebo_p:         {type: double, nullable: true}
      mde_k:             {type: double, nullable: true, description: "Minimum detectable effect at this site"}
      quality_label:     {type: string, nullable: false, description: "detected | not_detectable | inconclusive"}
      event_study_json:  {type: string, nullable: true, description: "JSON object {years_since_planting: effect_k}"}
      panel_version:     {type: string, nullable: true, description: "Delta version of silver.panel that was read"}
      method_version:    {type: string, nullable: false}
      evaluated_at_utc:  {type: timestamp, nullable: false}

  gold.recommendations:
    # Agent 4 owns this definition (MessageBoard, Agent 4 msg 2).
    writer: agent-4
    readers: [app]
    grain: one row per site_id; only candidate cells appear
    notes: >
      User-facing, so predicted cooling is POSITIVE = cooling (sign flipped
      from gold.site_effects.effect_k). Surface temperature, Kelvin.
    columns:
      country_code:                 {type: string, nullable: false}
      city_id:                      {type: string, nullable: false}
      site_id:                      {type: string, nullable: false}
      rank:                         {type: int,    nullable: false, description: "1 = best"}
      score:                        {type: double, nullable: false, description: "Predicted mature cooling x vulnerable residents / cost"}
      predicted_cooling_k_5y:       {type: double, nullable: true}
      predicted_cooling_k_5y_low:   {type: double, nullable: true}
      predicted_cooling_k_5y_high:  {type: double, nullable: true}
      predicted_cooling_k_15y:      {type: double, nullable: true}
      predicted_cooling_k_15y_low:  {type: double, nullable: true}
      predicted_cooling_k_15y_high: {type: double, nullable: true}
      vulnerable_residents:         {type: double, nullable: true}
      est_cost_usd:                 {type: double, nullable: true}
      suggested_intervention:       {type: string, nullable: true, description: "street_trees | park_trees | cool_roof | cool_pavement (from country config)"}
      holdout_control:              {type: boolean, nullable: false, description: "Ranked site deliberately left unplanted as a future control"}
      model_version:                {type: string, nullable: false, description: "MLflow run"}
      recommended_at_utc:           {type: timestamp, nullable: false}

  gold.prediction_log:
    # Agent 4 owns this definition (MessageBoard, Agent 4 msg 2). Also in MLflow.
    writer: agent-4
    readers: [agent-4, app]
    grain: one row per site_id x model_version
    notes: Scored against gold.site_effects once a logged site is evaluated.
    columns:
      country_code:       {type: string, nullable: false}
      city_id:            {type: string, nullable: false}
      site_id:            {type: string, nullable: false}
      model_version:      {type: string, nullable: false}
      pred_effect_k:      {type: double, nullable: true, description: "Same sign as effect_k: negative = cooling"}
      pred_effect_k_low:  {type: double, nullable: true}
      pred_effect_k_high: {type: double, nullable: true}
      predicted_at_utc:   {type: timestamp, nullable: false}
