# US configuration. Core code never imports this file; callers load it and pass
# values in. The app reads it directly for units and labels.

country_code: US

display:
  temperature_unit: fahrenheit   # storage is always Celsius/Kelvin (shared rule 10)
  area_unit: acres
  currency: USD

cities:
  - city_id: nyc
    name: New York
    lead: true
    center: {lat: 40.7128, lon: -74.0060}
  - city_id: dc
    name: Washington DC
    center: {lat: 38.9072, lon: -77.0369}
  - city_id: sf
    name: San Francisco
    center: {lat: 37.7749, lon: -122.4194}
  - city_id: sea
    name: Seattle
    center: {lat: 47.6062, lon: -122.3321}

# Editable cost assumptions per intervention, USD per H3 cell treated.
# Placeholder planning numbers for the prototype; a city can edit these.
costs_usd:
  street_trees: 18000      # ~30 trees/cell at ~$600 planted
  park_trees: 12000
  cool_roof: 25000
  cool_pavement: 40000

# Weights for the vulnerability score computed per cell in /core.
# score = sum(weight * normalized column). Columns come from silver.features.
vulnerability_formula:
  weights:
    heat_sensitive_share: 0.4   # share of residents 65+ or under 5
    poverty_share: 0.4
    no_ac_share: 0.2
  # vulnerable_residents = population * vulnerability_score

# Growth curve: fraction of mature cooling effect reached by year N.
cooling_maturity:
  year_5: 0.4
  year_15: 1.0

candidate_rules:
  max_canopy_pct: 20
  max_impervious_pct: 85
  allowed_land_cover: [developed_open, developed_low, developed_medium, grass, barren]

ranking:
  holdout_every_n: 5   # leave every Nth ranked site unplanted as a future control
